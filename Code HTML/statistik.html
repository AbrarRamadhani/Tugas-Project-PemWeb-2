<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistik - DeadlineTugas</title>
  <link rel="stylesheet" href="../Code CSS/statistik.css">
</head>
<body>
    <header class="navbar">
        <span class="brand">DeadlineTugas</span>

        <nav>
            <a href="../Code HTML/beranda.html">Beranda</a>
            <a href="../Code HTML/tugas.html">Tugas</a>
            <a href="../Code HTML/statistik.html" class="active">Statistik</a>
        </nav>
    </header>
    <main>
        <h1 class="judul-halaman">Statistik Tugasmu</h1>

        <div class="stat-grid">

        <article class="kartu-stat">
            <span>Total Tugas</span>
            <strong id="statTotal">0</strong>
        </article>

        <article class="kartu-stat">
            <span>Sudah Selesai</span>
            <strong id="statSelesai">0</strong>
        </article>

        <article class="kartu-stat">
            <span>Belum Selesai</span>
            <strong id="statBelum">0</strong>
        </article>

        <article class="kartu-stat">
            <span>Progress</span>
            <strong id="statProgress">0%</strong>
        </article>

        </div>

        <section class="panel riwayat">

        <div class="cari">
            <input
            type="text"
            id="inputCari"
            placeholder="Cari Riwayat Tugas..."
            >

            <button id="btnCari" class="btn-cari">
            Cari
            </button>
        </div>

        <ul id="listRiwayat" class="list"></ul>

        <p id="kosongRiwayat" class="kosong">Belum ada riwayat tugas.</p>

        </section>

    </main>
    <footer class="footer">
        <div>
            <strong>DeadlineTugas</strong>
            <p>Kelola tugas, ingat deadline, dan tetap teratur.</p>
        </div>

        <span>© 2026 DeadlineTugas</span>
  </footer>

  <script src="../Code JavaScript/statistik.js"></script>
</body>
</html>
